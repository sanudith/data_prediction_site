<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="PredictionPage.css">
</head>

<body>
    <div class="container">
        <!-- Close button that redirects to home page -->
        <div class="close-button" onclick="window.location.href='HomePage.html';">
			&times;
		</div>
			
        <div class="left-section"></div>
		
        <div class="right-section">
		
            <h2>Data Usage Prediction Form</h2>
            
            <label for="district">Select Your District</label>
            <select id="district" class="custom-dropdown">
                <option value="" disabled selected>Choose Your District</option>
                <option value="1">Anuradhapura District</option>
				<option value="2">Badulla District</option>
                <option value="3">Colombo District</option>
                <option value="4">Galle District</option>
				<option value="5">Gampaha District</option>
				<option value="6">Hambantota District</option>
				<option value="7">Jaffna District</option>
				<option value="8">Kalutara District</option>
				<option value="9">Kandy District</option>
				<option value="10">Kurunegala District</option>
                <option value="11">Matara District</option>
				<option value="12">Ratnapura District</option>
				<option value="13">Trincomalee District</option>
				<option value="14">Kilinochchi District</option>
				<option value="15">Kegalle District</option>
				<option value="16">Mannar District</option>
				<option value="17">Matale District</option>
				<option value="18">Monaragala District</option>
				<option value="19">Mullaitivu District</option>
				<option value="20">Nuwara Eliya District</option>
				<option value="21">Polonnaruwa District</option>
				<option value="22">Puttalam District</option>
				<option value="23">Vavuniya District</option>
            </select>
            
            <label for="location_cat">Select Your Loaction Catagory</label>
            <select id="location_cat" class="custom-dropdown">
                <option value="" disabled selected>Choose Your Location Catagory</option>
                <option value="1">Rural</option>
                <option value="2">Suburban</option>
                <option value="3">Urban</option>
            </select>
            
            <label for="graphics_time">Hours Per Day Spending to Do Video Editing and Graphic Designing Related Works
			(e.g. Rendering, Photo editing, 3D Modeling, etc.)</label>
            <input type="text" id="graphics_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="onlinegaming_time">Hours Per Day Spending to Play Online Games</label>
            <input type="text" id="onlinegaming_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="socialmedia_time">Hours Per Day Spending to Social Media (e.g. Facebook, Instagram, Tik-Tok, Twitter, etc.)</label>
            <input type="text" id="socialmedia_time" placeholder="Please Enter an Integer only, Without Units">
			
		    <label for="videocall_time">Hours Per Day Spending to Video Calls (e.g. Zoom, Skype, etc.)</label>
            <input type="text" id="videocall_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="videstream_time">Hours Per Day Spending to Streaming Videos (e.g. YouTube, Netflix, etc.)</label>
            <input type="text" id="videstream_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="moviedown_time">Hours Per Day Spending to Download Movies</label>
            <input type="text" id="moviedown_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="eleraning_time">Hours Per Day Spending to E-Learning (e.g. Coursera, Udemy, Moodle, DP Coding, etc.)</label>
            <input type="text" id="eleraning_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="filedown_time">Hours Per Day Spending to Upload and Download files (e.g. Remote work, accessing office networks)</label>
            <input type="text" id="filedown_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="musicstream_time">Hours Per Day Spending to Streaming Music (e.g. Spotify)</label>
            <input type="text" id="musicstream_time" placeholder="Please Enter an Integer only, Without Units">
			
			<label for="webbrowsing_time">Hours Per Day Spending to Web Browsing</label>
            <input type="text" id="webbrowsing_time" placeholder="Please Enter an Integer only, Without Units">
            
            <button type="button" onclick="calculateDataUsage()"><strong>Predict My Data Usage</strong></button>
			
			<!--This below div is a testing one-->
			<div class="loading-bar-container" id="loadingBarContainer" style="display: none;">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
			<!--Testing div ends here-->
        </div>
    </div>
	
	<!--This below div is a testing one-->
	<div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3>Predicted Results</h3>
            <p id="resultDisplay"></p>
            <button onclick="closeModal()">Close</button>

            <!-- New button for Package Information -->
            <button class="package-button" onclick="showPackageInfo()">Package Information</button>
        </div>
    </div>
	<!--Testing div ends here-->

    <!-- JavaScript to apply custom color to dropdown options -->
    <script>

        let total_data_usage;
        // Target all select elements with the custom-dropdown class
        document.querySelectorAll('.custom-dropdown').forEach(select => {
            select.addEventListener('focus', () => {
                select.style.color = '#00aaff'; // Change dropdown text color when focused
            });

            select.addEventListener('change', () => {
                select.style.color = '#ddd'; // Reset color after selection
            });
        });
		
		function calculateDataUsage() {
            document.getElementById("loadingBarContainer").style.display = "block";
            document.getElementById("loadingBar").style.width = "0%";
            
            setTimeout(() => {
                document.getElementById("loadingBar").style.width = "100%";
            }, 10);

            setTimeout(() => {
                const districtValue = parseFloat(document.getElementById("district").value) || 0;
                const locationCatValue = parseFloat(document.getElementById("location_cat").value) || 0;
                const contexual_factor_value = (districtValue + locationCatValue) / 2;

                const graphicsTime = parseFloat(document.getElementById("graphics_time").value) || 0;
                const onlineGamingTime = parseFloat(document.getElementById("onlinegaming_time").value) || 0;
				const socialMediaTime = parseFloat(document.getElementById("socialmedia_time").value) || 0;
				const videoCallTime = parseFloat(document.getElementById("videocall_time").value) || 0;
				const videoStreamTime = parseFloat(document.getElementById("videstream_time").value) || 0;
				const movieDownloadTime = parseFloat(document.getElementById("moviedown_time").value) || 0;
				const eLearningTime = parseFloat(document.getElementById("eleraning_time").value) || 0;
				const fileDownloadTime = parseFloat(document.getElementById("filedown_time").value) || 0;
				const musicStreamTime = parseFloat(document.getElementById("musicstream_time").value) || 0;
				const webBrowsingTime = parseFloat(document.getElementById("webbrowsing_time").value) || 0;
                const inputSum = graphicsTime + onlineGamingTime + socialMediaTime + videoCallTime + videoStreamTime + movieDownloadTime + eLearningTime + fileDownloadTime + musicStreamTime + webBrowsingTime; // Add other inputs here
                const application_factor_value = inputSum / 10;

                total_data_usage = -8.922 + (15.566 * application_factor_value) + (1.096 * contexual_factor_value);
                
                document.getElementById("loadingBarContainer").style.display = "none";
                document.getElementById("resultDisplay").innerText = "Predicted Monthly Data Usage is " + total_data_usage.toFixed(2) + " GB";
                document.getElementById("modalOverlay").style.display = "flex";
            }, 2000);
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
			
			// Clear all form fields
            document.getElementById("district").value = "";
            document.getElementById("location_cat").value = "";
            document.getElementById("graphics_time").value = "";
            document.getElementById("onlinegaming_time").value = "";
			document.getElementById("socialmedia_time").value = "";
			document.getElementById("videocall_time").value = "";
			document.getElementById("videstream_time").value = "";
			document.getElementById("moviedown_time").value = "";
			document.getElementById("eleraning_time").value = "";
			document.getElementById("filedown_time").value = "";
			document.getElementById("musicstream_time").value = "";
			document.getElementById("webbrowsing_time").value = "";
        }

        function showPackageInfo() {
            if (total_data_usage <= 10) {
                window.location.href = "PackagePage01.html"; // For low usage
            } 
            else if (total_data_usage <= 50) {
                window.location.href = "PackagePage01.html"; // For medium usage
            } 
            else {
                window.location.href = "PackagePage01.html"; // For high usage
            }
        }
    </script>
</body>
</html>

    <!-- Background Layers for Fading Effect -->
    <div id="background1" class="fade-background" style="background-image: url('Images/CoverImage02.jpg');"></div>
    <div id="background2" class="fade-background" style="background-image: url('Images/CoverImage03.jpg');"></div>

    <section class="home">
        <div class="home-content">
            <h1>Welcome to the Data Usage Predictor</h1>

    <script>
        const backgrounds = [
            "Images/CoverImage02.jpg",
            "Images/CoverImage04.jpg",
            "Images/CoverImage07.jpg",
			"Images/CoverImage08.jpg",
			"Images/CoverImage02.jpg",
			"Images/CoverImage07.jpg"
        ];

        let currentImageIndex = 0;
        const changeInterval = 7000;
        
        const background1 = document.getElementById('background1');
        const background2 = document.getElementById('background2');

        function changeBackgroundImage() {
            // Toggle which background div is visible
            if (currentImageIndex % 2 === 0) {
                background1.style.backgroundImage = `url(${backgrounds[currentImageIndex]})`;
                background1.style.opacity = "1";
                background2.style.opacity = "0";
            } else {
                background2.style.backgroundImage = `url(${backgrounds[currentImageIndex]})`;
                background2.style.opacity = "1";
                background1.style.opacity = "0";
            }

            // Move to the next image
            currentImageIndex = (currentImageIndex + 1) % backgrounds.length;
        }

        setInterval(changeBackgroundImage, changeInterval);
        changeBackgroundImage();
    </script>
</body>
